onboarding = false

[keys]
new_tab = "alt+t"
new_worktree = "alt+shift+t"
next_workspace = "alt+n"
previous_workspace = "alt+p"
previous_tab = "alt+j"
next_tab = "alt+k"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"

[ui]
status_indicators = "dots"

[ui.toast]
delivery = "system"
