onboarding = false

[keys]
new_tab = "alt+t"
new_worktree = "alt+shift+t"

# j/k walk spaces, n/p walk tabs, shift+j/shift+k walk agents.
previous_workspace = "alt+j"
next_workspace = "alt+k"
previous_tab = "alt+p"
next_tab = "alt+n"
previous_agent = "alt+shift+j"
next_agent = "alt+shift+k"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"

[ui]
status_indicators = "dots"

[ui.toast]
delivery = "system"
